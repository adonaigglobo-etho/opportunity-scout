# ============================================================================
# config.yaml  —  runtime settings for the Opportunity Scout
# ============================================================================

modes:
  sweep:
    lookback_days: 45          # monthly deep sweep window (overlaps to avoid gaps)
    do_lab_discovery: true     # run OpenAlex author/lab discovery
    propose_new_sources: true  # let the council nominate new sources
    max_candidates: 100         # pre-filter cap handed to the council
    top_n_to_push: 18
    quota_total: 18
    tier_quota:            # target per-tier counts; unfilled slots redistribute to tiers with surplus
      regional: 4
      national: 6
      international: 8           # how many ranked hits to send to Telegram
  deadlines:
    lookback_days: 0           # no new discovery
    recheck_known: true        # re-scan active sources + context doc for deadlines
    urgent_within_days: 21     # push anything closing within this window
    do_lab_discovery: false
    propose_new_sources: false

council:
  # Collapsed per council review: one combined scorer + one INDEPENDENT eligibility
  # gate (its whole value is independence). Deadlines are handled in code
  # (scout.py parses cadence dates), not by a persona.
  seats:
    - name: "The Scorer"
      brief: >
        Single scoring pass combining fit (stage/field/methods), strategic value
        (prestige, doors opened, effort-to-reward), and — for labs/researchers —
        collaboration value plus warm-tie check against network.yaml. Produces a
        ranked shortlist.
    - name: "The Eligibility Gate"
      brief: >
        Runs INDEPENDENTLY, after the Scorer, purely to catch disqualifiers:
        residency, membership, career-stage, nationality, enrolment. Can veto or
        flag any item regardless of how highly the Scorer ranked it. Red flags go
        to the TOP of the item, never hidden.
  quorum_for_new_source: 2     # both seats must agree to propose a source addition
  chair_model: opus            # synthesises the ranking + writes the digest
  advisor_models: [opus, sonnet]

telegram:
  bot_token_env: "TELEGRAM_BOT_TOKEN"   # cloud env var; local SCOUT_BOT_TOKEN also works
  chat_id_env: "TELEGRAM_CHAT_ID"        # cloud env var; local SCOUT_CHAT_ID also works
  # Greenlights: you reply to a pushed item to approve it. Approved items are
  # written to context/approved_queue.json for skill 2 (the drafter) to pick up.
  approval_keywords: [yes, go, draft, "✅", approve]
  reject_keywords: [no, skip, "❌"]

output:
  dir: "output"
  keep_history: true
  digest_format: markdown      # one file per run, side-by-side candidates

dedup:
  store: "context/seen.json"   # DOIs / call-URLs / person-IDs already surfaced
  suppress_days: 120           # don't re-surface the same opportunity within N days
