# ============================================================================
# config.yaml  —  runtime settings for the Opportunity Scout
# ============================================================================

modes:
  sweep:
    lookback_days: 45          # monthly deep sweep window (overlaps to avoid gaps)
    do_lab_discovery: true     # run OpenAlex author/lab discovery
    propose_new_sources: true  # let the council nominate new sources
    max_candidates: 40         # pre-filter cap handed to the council
    top_n_to_push: 8           # how many ranked hits to send to Telegram
  deadlines:
    lookback_days: 0           # no new discovery
    recheck_known: true        # re-scan active sources + context doc for deadlines
    urgent_within_days: 21     # push anything closing within this window
    do_lab_discovery: false
    propose_new_sources: false

council:
  # Advisor seats (domain personas). Each is an isolated subagent.
  seats:
    - name: "The Fit Analyst"
      brief: "Scores how well an opportunity matches the profile's stage, field, methods, eligibility."
    - name: "The Strategist"
      brief: "Weighs career value: prestige, doors it opens, deadline realism, effort-to-reward."
    - name: "The Eligibility Skeptic"
      brief: "Hunts for disqualifiers: residency, membership, career-stage, nationality limits. Guards against false hope."
    - name: "The Connector"
      brief: "For labs/researchers: judges collaboration value and whether a warm tie exists in network.yaml."
  quorum_for_new_source: 3     # of 4 seats must agree to propose a source addition
  chair_model: opus            # synthesises the ranking + writes the digest
  advisor_models: [opus, sonnet, sonnet, sonnet]

telegram:
  bot_token_env: "SCOUT_BOT_TOKEN"   # set as env var; never hard-code
  chat_id_env: "SCOUT_CHAT_ID"
  # Greenlights: you reply to a pushed item to approve it. Approved items are
  # written to context/approved_queue.json for skill 2 (the drafter) to pick up.
  approval_keywords: [yes, go, draft, "✅", approve]
  reject_keywords: [no, skip, "❌"]

output:
  dir: "output"
  keep_history: true
  digest_format: markdown      # one file per run, side-by-side candidates

dedup:
  store: "context/seen.json"   # DOIs / call-URLs / person-IDs already surfaced
  suppress_days: 120           # don't re-surface the same opportunity within N days
