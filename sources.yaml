# ============================================================================
# sources.yaml  —  YOUR editable source list for the Opportunity Scout council
# ----------------------------------------------------------------------------
# The scout crawls every source under `active:` each run. The council may
# PROPOSE additions during a --sweep; approved-by-quorum candidates land in
# `pending_sources:` and wait for your Telegram "yes" before being promoted here.
#
# Fields per source:
#   name        : human label
#   url         : landing / call page the scout fetches
#   type        : portal | society | aggregator | api | rss  (how to read it)
#   tags        : which of YOUR interests it serves (used for relevance scoring)
#   cadence     : how often calls open, if known (freeform note)
#   notes       : eligibility gotchas, verified status, anything worth remembering
#
# tags vocabulary (edit freely): grant, predoc, postdoc, mobility, travel,
#   thesis-prize, collaboration, job, animal-behaviour, cognition, ecology,
#   sci-comm, spain, eu
# ============================================================================

profile:
  # Used by the council to score fit. Keep this honest and current.
  name: "Adonai Gil Gómez-Lobo"
  stage: "just completed TFM (master's thesis) and is working as a Research Assistant at the Animal Minds Lab, leaded by Alex Taylor"
  location: "Spain, Barcelona, Cataluña"
  fields: [comparative cognition, animal behaviour, behavioural flexibility, collective animal cognition, cross-species cognition comparison]
  methods: [GLM-HMM, PsychoPy, Pavlovia/PsychoJS, behavioural modelling, linear regression, bayesian regression]
  pi: "Alex Taylor"
  keywords_openalex: [animal cognition, comparative cognition, behavioural flexibility, bird cognition, animal social learning, behavioural ecology, collective animal behaviour, animal culture]
  language: [English, Spanish]

  # Regional tier = Catalonia + everything within ~2h of Barcelona (your cities list).
  # Used to tag lab/researcher hits and funding sources as regional/national/international.
  region:
    home_institutions: [Universitat Autonoma de Barcelona, UAB, Universitat de Barcelona,
                         Universitat Pompeu Fabra, CREAF, CSIC, IBE, CRG, Institut de Neurociencies]
    regional_provinces: [Barcelona, Girona, Tarragona, Lleida, Andorra, Aragon, Zaragoza,
                         Valencia, Comunidad Valenciana, Illes Balears, Baleares]
    regional_country_codes: [ES]           # Spain; refined to region by province/city below
    national_country_codes: [ES, PT]       # Spain + Portugal = "national" tier
    # (everything else = international, mostly Europe)

# ----------------------------------------------------------------------------
active:

  # === Spanish pre/post-doctoral funding ===================================
  - name: "la Caixa INPhINIT Doctoral Fellowships"
    url: "https://lacaixafoundation.org/en/doctoral-inphinit-fellowships"
    type: portal
    tier: national
    tags: [grant, predoc, spain, mobility]
    cadence: "Annual — Incoming ~28 Jan, Retaining ~18 Feb (2026 dates verified)"
    notes: "STEM/life-sciences eligible. Incoming = NOT resident in ES/PT >12mo of last 3yr; Retaining = resident in ES/PT. Host must hold Severo Ochoa / María de Maeztu accreditation for Incoming."

  - name: "la Caixa Junior Leader (postdoc)"
    url: "https://lacaixafoundation.org/en/junior-leader-postdoctoral-fellowships"
    type: portal
    tier: national
    tags: [grant, postdoc, spain, mobility]
    cadence: "Annual, typically autumn call"
    notes: "For later — postdoc stage. Incoming/Retaining split like INPhINIT. Seed for future eligibility."

  - name: "FPU — Ayudas para la Formación de Profesorado Universitario (MEFP)"
    url: "https://www.universidades.gob.es/formacion-de-profesorado-universitario-fpu/"
    type: portal
    tier: national
    tags: [grant, predoc, spain]
    cadence: "Annual, ministry call (usually late autumn/winter)"
    notes: "Requires enrolment/admission in a doctoral programme. Confirm exact call URL each cycle — ministry restructures pages."

  - name: "FPI — Ayudas para contratos predoctorales (AEI)"
    url: "https://www.aei.gob.es/convocatorias"
    type: portal
    tier: national
    tags: [grant, predoc, spain]
    cadence: "Annual, tied to funded research projects"
    notes: "FPI is attached to a specific funded project/PI — so a target lab in Spain with an active AEI project is the entry point. Cross-reference with lab_discovery hits."

  - name: "AEI — Agencia Estatal de Investigación (all calls)"
    url: "https://www.aei.gob.es/convocatorias/buscador-convocatorias"
    type: portal
    tier: national
    tags: [grant, predoc, postdoc, spain]
    cadence: "Rolling"
    notes: "Master call index for Spanish state research funding. Broad — filter hard by tags."

  - name: "AGAUR Joan Oró FI — Catalan predoctoral grant"
    url: "https://agaur.gencat.cat/es/beques-i-ajuts/Research-grants/ajuts-predoctorals/index.html"
    type: portal
    tier: regional
    tags: [grant, predoc, spain]
    cadence: "Annual — 2026 call closed ~30 Jan; expect next call ~Jan 2027"
    notes: "THE Catalan predoc grant (formerly FI, now 'Joan Oró FI'). 3-year contract, requires enrolment in a Catalan doctoral programme. Direct regional fit if you do your PhD at UAB/UB/UPF/CREAF etc. Official trámit: tramits.gencat.cat (search 'Joan Oró FI')."

  - name: "Govern Illes Balears — ajuts predoctorals (GOIB/DGPRI)"
    url: "https://www.caib.es/seucaib/es/tramites/"
    type: portal
    tier: regional
    tags: [grant, predoc, spain]
    cadence: "Annual (confirm current call on the Balearic science/education portal)"
    notes: "Balearic Islands regional predoc/research aid. Confirm the exact current call URL; the CAIB seu electrònica lists open trámites. Relevant given your <2h/ferry regional reach."

  - name: "Generalitat Valenciana — ajudes predoctorals (GVA/Conselleria)"
    url: "https://innova.gva.es/es/ayudas"
    type: portal
    tier: regional
    tags: [grant, predoc, spain]
    cadence: "Annual (GVA predoc calls typically autumn)"
    notes: "Valencian regional predoctoral grants (ACIF/Santiago Grisolía historically). Confirm the current-year call on the GVA innovation portal."

  - name: "Gobierno de Aragón — ayudas predoctorales (DGA)"
    url: "https://www.aragon.es/-/ayudas-predoctorales"
    type: portal
    tier: regional
    tags: [grant, predoc, spain]
    cadence: "Annual (confirm on the DGA research portal)"
    notes: "Aragón regional predoc contracts. Relevant to the western edge of your <2h reach (Zaragoza). Confirm current call."

  - name: "Generalitat de Catalunya — FI predoctoral (AGAUR)"
    url: "https://agaur.gencat.cat/en/beques-i-ajuts/"
    type: portal
    tier: regional
    tags: [grant, predoc, spain]
    cadence: "Annual"
    notes: "Regional predoc (relevant if targeting Catalan institutions, e.g. CREAF/CSIC Barcelona — see Daniel Sol in network.yaml)."

  # === EU mobility & fellowships ===========================================
  - name: "Marie Skłodowska-Curie Actions — Doctoral Networks & Postdoctoral Fellowships"
    url: "https://marie-sklodowska-curie-actions.ec.europa.eu/actions"
    type: portal
    tier: international
    tags: [grant, predoc, postdoc, mobility, eu]
    cadence: "Annual per action (PF call typically opens spring, closes ~Sep)"
    notes: "Doctoral Networks are applied for by consortia (you join as a recruited fellow — watch for open recruited positions). PF is postdoc-stage."

  - name: "EMBO Postdoctoral Fellowships"
    url: "https://www.embo.org/funding/fellowships-grants-and-career-support/postdoctoral-fellowships/"
    type: society
    tier: international
    tags: [grant, postdoc, mobility, eu]
    cadence: "Two rounds/year (spring & autumn; autumn deadline ~23 Jan verified for 2026 round rules)"
    notes: "Postdoc-stage; international mobility required. One host lab = one candidate per round. Seed for future."

  - name: "EMBO Scientific Exchange Grants"
    url: "https://www.embo.org/funding/fellowships-grants-and-career-support/scientific-exchange-grants/"
    type: society
    tier: international
    tags: [travel, mobility, collaboration, eu]
    cadence: "Rolling"
    notes: "Funds research visits up to 3 months to another lab to learn techniques. Good fit for a short methods exchange (e.g. modelling collaboration)."

  - name: "Erasmus+ (traineeships / mobility)"
    url: "https://erasmus-plus.ec.europa.eu/opportunities/individuals"
    type: portal
    tier: international
    tags: [mobility, travel, eu]
    cadence: "Via home institution"
    notes: "Usually routed through your university's international office; note as a channel, not a direct call."

  # === Field societies: animal behaviour / cognition / ecology =============
  - name: "ASAB Research Grants"
    url: "https://www.asab.org/research-grants"
    type: society
    tier: international
    tags: [grant, travel, collaboration, animal-behaviour]
    cadence: "Three rounds/year — deadlines 1 Feb, 1 Jun, 1 Oct (verified)"
    notes: "Up to £10k (£15k with justification). Explicitly funds travel to conduct COLLABORATIVE research or to bring a collaborator to you. Does NOT usually accept applicants based in the Americas — fine for Spain. No overheads."

  - name: "ASAB Scholarships & smaller grants"
    url: "https://www.asab.org/grant-overview"
    type: society
    tier: international
    tags: [grant, travel, animal-behaviour, sci-comm]
    cadence: "Various"
    notes: "Includes conference support, education grants, caregiver grants. Skim the overview page for anything ECR-eligible."

  - name: "Animal Behavior Society — Grants & Awards"
    url: "https://www.animalbehaviorsociety.org/web/awards.php"
    type: society
    tier: international
    tags: [grant, travel, thesis-prize, animal-behaviour]
    cadence: "Annual cycles per award"
    notes: "Early Career Research Grants, Student Research Grants, Travel Awards, plus named awards. Many require ABS (or ASAB) membership in good standing — factor membership into eligibility."

  - name: "Company of Biologists — Travelling Fellowships"
    url: "https://www.biologists.com/grants/travelling-fellowships/"
    type: society
    tier: international
    tags: [travel, collaboration, mobility]
    cadence: "Rolling / journal-specific"
    notes: "Up to £3k for ECRs (grad students & postdocs) to undertake collaborative lab visits. No nationality restriction. Journal of Experimental Biology is the best-fit journal for behaviour/physiology."

  - name: "Company of Biologists — DMM/JEB conference & partnership travel grants"
    url: "https://www.biologists.com/grants/"
    type: society
    tier: international
    tags: [travel, sci-comm]
    cadence: "Quarterly (SEB-linked travel grant: 31 Mar / 30 Jun / 30 Sep / 31 Dec)"
    notes: "Smaller conference-attendance travel grants; some require SEB membership. Good for getting to a target conference cheaply."

  - name: "International Society for Behavioral Ecology (ISBE)"
    url: "https://behavecol.org/"
    type: society
    tier: international
    tags: [grant, travel, ecology, animal-behaviour]
    cadence: "Around biennial congress"
    notes: "Congress travel awards + occasional grants. Confirm current schemes on site."

  - name: "European Society for Evolutionary Biology (ESEB)"
    url: "https://eseb.org/prizes-funding/"
    type: society
    tier: international
    tags: [grant, travel, mobility, ecology]
    cadence: "Various (e.g. Godfrey-Smith / research exchange schemes)"
    notes: "Research exchange and outreach funding; relevant on the evolution/culture angle."

  - name: "Comparative Cognition Society (CO3)"
    url: "https://www.comparativecognition.org/student_awards.php"
    type: society
    tier: international
    tags: [grant, travel, thesis-prize, cognition, animal-behaviour]
    cadence: "Student-award deadlines ~Dec (a few months before CO3, held ~April); Stan Kuczaj travel grant ~Feb 28"
    notes: "THE defining society for this exact profile. Student awards (publication, best talk/poster, travel) + Stan Kuczaj Memorial Travel Grant to CO3; separate Early Career Award for early-career faculty (first 5 yrs of first post, $1000). MUST be a current CCS member to apply; you now apply for all awards. Confirm current-cycle deadlines on the student-awards page."

  - name: "Fondation Fyssen — postdoctoral study grants"
    url: "https://www.fondationfyssen.fr/en/"
    type: society
    tier: national
    tags: [grant, postdoc, mobility, cognition, animal-behaviour]
    cadence: "Annual — application window roughly Feb–Mar (confirm on site)"
    notes: "Animal-cognition-focused foundation; postdoc study grants (~€45k range) for mobility. Postdoc-stage — seed for after the PhD."

  # === Thesis prizes (premios TFM/TFG) =====================================
  - name: "UAB — Premis / Premi Extraordinari de Màster"
    url: "https://www.uab.cat/web/estudis/grau/informacio-academica/premis-extraordinaris-de-titulacio-1345662186782.html"
    type: portal
    tier: national
    tags: [thesis-prize, spain]
    cadence: "Awarded once per academic year for the previous year's graduates"
    notes: "UAB premi extraordinari de titulacio is AWARDED AUTOMATICALLY - you do NOT apply. Eligible if you finished the master in the previous academic year with global GPA >= 8.0; a faculty tribunal decides on academic record. Nothing to submit. Your master is at the Institut de Neurociencies (INc): https://www.uab.cat/en/incuab - confirm the master-level prize with your programme academic-affairs office (the INc site currently lists doctorate-level prizes)."

  - name: "SEEEE — Sociedad Española de Etología y Ecología Evolutiva"
    url: "https://etologia.org/"
    type: society
    tier: national
    tags: [thesis-prize, travel, animal-behaviour, ecology, spain]
    cadence: "Annual, around the society congress"
    notes: "Spanish ethology/evolutionary-ecology society - young-researcher / best-thesis awards and congress support. Directly on-profile and Spain-based. NOTE: www.etologia.org threw an SSL cert error last run; entry now uses etologia.org (no www)."

  # === Aggregators & discovery feeds =======================================
  - name: "Euraxess (Spain) — jobs, funding & fellowships"
    url: "https://euraxess.ec.europa.eu/jobs/search"
    type: aggregator
    tier: international
    tags: [grant, job, postdoc, predoc, mobility, collaboration, eu, spain]
    cadence: "Rolling — richest single structured source"
    notes: "Filter by field + country. Best all-round source for mobility/funding/jobs. Prioritise in every run."

  - name: "scientifyRESEARCH funding database"
    url: "https://www.scientifyresearch.org/"
    type: aggregator
    tier: international
    tags: [grant, travel, mobility]
    cadence: "Rolling"
    notes: "Curated, structured grant/fellowship listings with deadlines — good for catching quarterly travel grants."

  - name: "jobs.ac.uk"
    url: "https://www.jobs.ac.uk/search/?keywords=animal%20behaviour%20cognition"
    type: aggregator
    tier: international
    tags: [job, postdoc, predoc]
    cadence: "Rolling — where most UK/EU animal-behaviour PhD/RA posts appear"
    notes: "Primary board for UK/European academic posts in the field. Cross-check hits against lab_discovery for warm-connection targets."

  - name: "Nature Careers"
    url: "https://www.nature.com/naturecareers/jobs/animal-behaviour"
    type: aggregator
    tier: international
    tags: [job, postdoc, predoc]
    cadence: "Rolling"
    notes: "Higher-profile research posts and fellowships across the life sciences."

  - name: "jobRxiv"
    url: "https://jobrxiv.org/"
    type: aggregator
    tier: international
    tags: [job, postdoc, predoc]
    cadence: "Rolling"
    notes: "Life-sciences positions incl. PhD/RA. Cross-check hits against lab_discovery for warm-connection targets."

  - name: "ResearchGate / Bluesky / X open calls"
    url: "https://bsky.app/search?q=PhD%20position%20animal%20cognition"
    type: aggregator
    tier: international
    tags: [job, collaboration, predoc]
    cadence: "Rolling — social"
    notes: "Informal but timely. Many labs post openings + collaboration calls here before formal portals. Treat as low-confidence signal; verify before acting."

  # === Lab & researcher discovery (for cold/warm outreach) =================
  - name: "OpenAlex — author & institution discovery"
    url: "https://api.openalex.org/"
    type: api
    tier: international
    tags: [collaboration, cognition, animal-behaviour, ecology]
    cadence: "On demand (every --sweep)"
    notes: "Primary engine for finding labs/researchers by topic overlap. Query authors by concept + recent works; rank by overlap with profile.keywords_openalex. Feeds outreach targets to skill 2. No key needed."

  - name: "ORCID"
    url: "https://orcid.org/"
    type: api
    tier: international
    tags: [collaboration]
    cadence: "On demand"
    notes: "Resolve a discovered author to affiliation/email-visibility and recent outputs before drafting outreach."

