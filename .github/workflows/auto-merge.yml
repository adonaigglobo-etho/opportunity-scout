name: Auto-merge routine PRs

# Automatically merges pull requests opened by the Opportunity Scout routine
# (branches named claude/*) — BUT only when the PR touches data files
# (context/, output/, sources.yaml). If a PR changes code or config
# (scout.py, config.yaml, SKILL.md, network.yaml, .github/), it is LEFT OPEN
# for you to review manually. So routine state merges itself; anything that
# could change behaviour still needs your eyes.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR only touches data files
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const allowed = /^(context\/|output\/|sources\.yaml$)/;
            const bad = files.map(f => f.filename).filter(n => !allowed.test(n));
            if (bad.length) {
              core.notice('PR touches non-data files, skipping auto-merge (review manually): ' + bad.join(', '));
              core.setOutput('safe', 'false');
            } else {
              core.setOutput('safe', 'true');
            }
      - name: Merge if safe
        if: steps.guard.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash --delete-branch \
            --repo ${{ github.repository }}
