name: Auto-merge routine PRs

# The Opportunity Scout routine pushes a claude/* branch each run but does not
# reliably open a PR. So this workflow triggers on the PUSH itself: it opens a PR
# from the branch into main, then merges it — BUT only if the branch changed only
# data files (context/, output/, sources.yaml). Anything touching code or config
# (scout.py, config.yaml, SKILL.md, network.yaml, .github/) is left as an open PR
# for you to review. State merges itself; behaviour changes still need your eyes.

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  open-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check changed files vs main (data-only?)
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const base = 'main';
            const head = context.ref.replace('refs/heads/', '');
            const cmp = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${base}...${head}`,
            });
            const files = (cmp.data.files || []).map(f => f.filename);
            const allowed = /^(context\/|output\/|sources\.yaml$)/;
            const bad = files.filter(n => !allowed.test(n));
            core.setOutput('head', head);
            core.setOutput('nfiles', String(files.length));
            if (files.length === 0) {
              core.notice('No diff vs main; nothing to merge.');
              core.setOutput('safe', 'false');
            } else if (bad.length) {
              core.notice('Touches non-data files, will open PR but NOT auto-merge: ' + bad.join(', '));
              core.setOutput('safe', 'false');
            } else {
              core.setOutput('safe', 'true');
            }

      - name: Open PR (if one doesn't exist)
        if: steps.guard.outputs.nfiles != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD="${{ steps.guard.outputs.head }}"
          gh pr view "$HEAD" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh pr create --repo "${{ github.repository }}" \
            --base main --head "$HEAD" \
            --title "Scout run: $HEAD" \
            --body "Automated Opportunity Scout run. Auto-merges if data-only."

      - name: Merge if data-only
        if: steps.guard.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.guard.outputs.head }}" \
            --squash --delete-branch \
            --repo "${{ github.repository }}"
